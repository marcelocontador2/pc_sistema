<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><title>Análise Orçamentária Comparativa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js">function exibirSelecionado() {
            const check = document.querySelector(".check-hist:checked");
            if (!check) { alert("Selecione um item no histórico."); return; }

            // Busca o período no banco usando o ID
            fetch('/historico_analise_orcamentaria/' + check.value)
                .then(r => r.json())
                .then(resp => {
                    // O backend retorna {periodo: "...", dados: {...}} ou similar
                    // Vamos extrair o período de qualquer campo disponível
                    let periodo = resp.periodo || resp.periodo_atual || resp.periodo_anterior;
                    
                    if (!periodo) {
                        // Fallback: pega do JSON se existir
                        if (resp.dados && resp.dados.periodo_atual) {
                            periodo = resp.dados.periodo_atual;
                        }
                    }
                    
                    if (!periodo) {
                        // Último fallback: usa o select atual
                        periodo = document.getElementById('periodo').value;
                    }
                    
                    if (periodo) {
                        // Define o select e chama a função de carregar
                        document.getElementById('periodo').value = periodo;
                        carregar();
                    } else {
                        alert("Não foi possível identificar o período do histórico.");
                    }
                })
                .catch(e => alert("Erro ao carregar o histórico: " + e.message));
        }
</script>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6f9;padding:20px;margin:0;color:#333}
.btn{padding:8px 18px;border:none;border-radius:4px;color:#fff;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;font-size:13px}
.hdr-sub{color:#4a90e2;font-size:13px;text-transform:uppercase;letter-spacing:2px;font-weight:bold;margin-bottom:6px}
.hdr-tit{color:#003366;font-size:30px;font-weight:bold;margin-bottom:20px}
.main{display:flex;gap:25px;align-items:flex-start;margin-top:10px}
.esq{flex:1.1;min-width:0}.dir{flex:1;min-width:0}
.tab{border:1px solid #cbd5e1;border-radius:6px;overflow:hidden;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#003366;color:#fff;padding:14px 12px;font-weight:bold;font-size:13px;border:1px solid #002244;text-align:center}
td{padding:12px;border-bottom:1px solid #e2e8f0;font-size:13px}
td:first-child{font-weight:bold;text-align:left}
td:not(:first-child){text-align:right;font-family:'Consolas',monospace}
.pos{color:#28a745}.neg{color:#dc3545}
tr:nth-child(even){background:#f8fbff}
.concl{margin-top:18px;padding:14px;background:#fff;border-left:4px solid #003366;font-size:12.5px;line-height:1.5}
.graf-box{background:#fff;padding:20px;border-radius:6px;border:1px solid #cbd5e1}
#historico-lista{list-style:none;padding:0;margin:0}
#historico-lista li{margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:6px;font-size:13px}
.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px;background:#fff;padding:12px;border-radius:6px;border:1px solid #cbd5e1}
.side{width:220px;background:#fff;padding:12px;border-radius:6px;border:1px solid #cbd5e1;flex-shrink:0}
</style>
</head>
<body>
<div style="margin-bottom:15px;display:flex;gap:8px;flex-wrap:wrap">
<a href="/" class="btn" style="background:#ff7f00">&#8592; Voltar</a>
<button class="btn" style="background:#28a745" onclick="exibirSelecionado()">Exibir</button>
<button class="btn" style="background:#dc3545" onclick="excluirSelecionado()">Excluir</button>
<button class="btn" style="background:#0056b3" onclick="gerarPDF()">Gerar PDF</button>
</div>

<div class="hdr-sub">Execução Orçamentária</div>
<div class="hdr-tit">Análise Orçamentária Comparativa</div>

<div class="filtros">
<label>Período:</label>
<select id="periodo">
<option value="2026-TRIMESTRE-3">2026 - 3º Trimestre</option>
<option value="2026-TRIMESTRE-2">2026 - 2º Trimestre</option>
<option value="2026-TRIMESTRE-1">2026 - 1º Trimestre</option>
<option value="2025-TRIMESTRE-3">2025 - 3º Trimestre</option>
</select>
<button class="btn" style="background:#0056b3" onclick="carregar()">Verificar Análise</button>
<button class="btn" style="background:#28a745" onclick="salvarRelatorio()">Confirmar e Salvar</button>
</div>

<div style="display:flex;gap:20px;align-items:flex-start">
<div class="side">
<h3 style="margin-top:0;font-size:15px">Histórico Salvo</h3>
<ul id="historico-lista"><li>Carregando...</li></ul>
</div>
<div style="flex:1;min-width:0">
<div class="main">
<div class="esq">
<div class="tab"><table id="tab">
<thead><tr><th>Indicador</th><th>Período Atual</th><th>Período Anterior</th><th>Var. (%)</th></tr></thead>
<tbody><tr><td colspan="4" style="text-align:center">Clique em "Verificar Análise"</td></tr></tbody>
</table></div>
<div class="concl" id="concl" style="display:none"></div>
</div>
<div class="dir">
<div class="graf-box"><canvas id="graf" style="min-height:380px"></canvas></div>
</div>
</div>
</div>
</div>

<script>
let chart=null;
function carregar(){
  
const p=document.getElementById('periodo').value;
  const pa=p.replace('2026','2025');
  const tb=document.querySelector('#tab tbody');
  tb.innerHTML='<tr><td colspan="4" style="text-align:center">Buscando...</td></tr>';
  Promise.all([
    fetch('/api/analise_orcamentaria_bo/'+p).then(r=>r.json()),
    fetch('/api/analise_orcamentaria_bo/'+pa).then(r=>r.json())
  ]).then(([a,b])=>{
        // === CARD: demonstrativos faltando ===
        const conclEl = document.getElementById("concl");
        if (conclEl) { conclEl.style.display = "none"; conclEl.innerHTML = ""; }
        const pecasFaltando = [];
        if (a && a.erro === "faltando" && a.pecas) pecasFaltando.push(...a.pecas);
        if (b && b.erro === "faltando" && b.pecas) pecasFaltando.push(...b.pecas);
        if (pecasFaltando.length > 0) {
            const divErro = document.getElementById("concl") || document.querySelector(".concl") || document.body;
            divErro.style.display = "block";
            let htmlErro = '<div style="background:#fff3cd;border-left:5px solid #ffc107;padding:20px;border-radius:8px;">';
            htmlErro += '<h3 style="color:#856404;margin:0 0 10px 0;">⚠️ Demonstrativos Faltando</h3>';
            htmlErro += '<p style="color:#856404;">Os seguintes demonstrativos não foram importados:</p><ul style="color:#856404;">';
            [...new Set(pecasFaltando)].forEach(p => { htmlErro += '<li>' + p + '</li>'; });
            htmlErro += '</ul><p style="color:#856404;margin-top:10px;">Acesse <strong>Importar Relatórios</strong> para enviar os arquivos pendentes.</p></div>';
            divErro.innerHTML = htmlErro;
            const tbErro = document.querySelector("#tab tbody");
            if (tbErro) tbErro.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#856404;">Aguardando importação.</td></tr>';
            if (typeof chart !== 'undefined' && chart) { chart.destroy(); chart = null; }
            return;
        }

    if(a.erro||b.erro){
      let m='';
      if(a.erro) m+='Atual: '+a.mensagem+' ';
      if(b.erro) m+='Anterior: '+b.mensagem;
      tb.innerHTML='<tr><td colspan="4" style="text-align:center;color:red;font-weight:bold">'+m+'</td></tr>';
      if(chart){chart.destroy();chart=null}
      return;
    }
    const ind=[
      {n:'Receita Realizada (R$)',k:'receita_realizada',m:1e6},
      {n:'Despesas Empenhadas (R$)',k:'despesa_empenhada',m:1e6},
      {n:'Superávit Orçamentário (R$)',k:'superavit',m:1e6},
      {n:'Restos a Pagar Inscritos (R$)',k:'restos_pagar',m:1e6},
      {n:'Receitas Orçadas (R$)',k:'receita_orcada',m:1e6},
      {n:'Despesas Orçadas (R$)',k:'despesa_orcada',m:1e6},
      {n:'% de Realização das Receitas',k:'pct_receita',m:1,f:'%'},
      {n:'% de Realização das Despesas',k:'pct_despesa',m:1,f:'%'}
    ];
    let out='';
    ind.forEach(d=>{
      const va=(a[d.k]||0), vb=(b[d.k]||0);
      const v=vb!==0?((va-vb)/Math.abs(vb))*100:0;
      const cls=v>=0?'pos':'neg', sg=v>=0?'+':'';
      const fa=d.f||'';
      out+='<tr><td>'+d.n+'</td><td>'+va.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+fa+'</td><td>'+vb.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+fa+'</td><td class="'+cls+'">'+sg+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%</td></tr>';
    });
    tb.innerHTML=out;
    document.getElementById('concl').style.display='block';
    document.getElementById('concl').innerHTML='<strong>Principais conclusões:</strong> a receita realizada representa '+a.pct_receita.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'% da previsão atualizada, enquanto as despesas empenhadas representam '+a.pct_despesa.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'% da dotação atualizada. A variação do superávit orçamentário e os restos a pagar inscritos merecem monitoramento.';
    if(chart) chart.destroy();
    chart = new Chart(document.getElementById('graf').getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['Receita Realizada', 'Despesa Empenhada', 'Superávit Orçamentário'],
                datasets: [
                    {
                        label: 'Período Atual',
                        data: [a.receita_realizada/1e6, a.despesa_empenhada/1e6, a.superavit/1e6],
                        backgroundColor: '#003366',
                        borderRadius: 4
                    },
                    {
                        label: 'Período Anterior',
                        data: [b.receita_realizada/1e6, b.despesa_empenhada/1e6, b.superavit/1e6],
                        backgroundColor: '#4a90e2',
                        borderRadius: 4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } },
                scales: { y: { beginAtZero: true, grid: { color: '#eef2f7' } } }
            }
        });
    }).catch(e=>{tb.innerHTML='<tr><td colspan="4" style="text-align:center;color:red">Erro de conexão.</td></tr>'});
}

async function salvarRelatorio(){
  const periodo=document.getElementById('periodo').value;
  try{
    const r=await fetch('/salvar_analise_orcamentaria/'+periodo,{method:'POST'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    alert('Relatorio salvo com sucesso!');
    carregarHistorico();
  }catch(e){alert('Erro ao salvar: '+e.message);}
}

function carregarHistorico(){
  const el=document.getElementById('historico-lista');
  fetch('/historico_analise_orcamentaria').then(r=>r.json()).then(d=>{
    if(!d||d.length===0){el.innerHTML='<li>Nenhum histórico.</li>';return;}
    let html='';
    d.forEach(i=>{html+='<li><label><input type="checkbox" class="check-hist" value="'+i.id+'"> <strong>'+i.periodo+'</strong><br><small>'+i.data_geracao+'</small></label></li>';});
    el.innerHTML=html;
  }).catch(()=>{el.innerHTML='<li>Erro ao carregar.</li>';});
}

function excluirSelecionado(){
  const sel=document.querySelectorAll('.check-hist:checked');
  if(sel.length===0){alert('Selecione um item.');return;}
  if(!confirm('Excluir '+sel.length+' item(ns)?'))return;
  Promise.all([...sel].map(c=>fetch('/excluir_analise_orcamentaria/'+c.value,{method:'DELETE'}).then(r=>r.ok).catch(()=>false)))
    .then(rs=>{if(rs.some(x=>x)){alert('Excluído!');carregarHistorico();}});
}
function gerarPDF(){
  const ck=document.querySelector('.check-hist:checked');
  if(!ck){alert('Marque um item no histórico.');return;}
  window.open('/gerar_pdf_analise_orcamentaria/'+ck.value,'_blank');
}
document.addEventListener('DOMContentLoaded',carregarHistorico);

                    }

                    }

        }
</script>
</body></html>
