<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Custo de Pessoal</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #fff; border-right: 1px solid #ccc; padding: 20px; }
        .main { flex: 1; padding: 30px; }
        .botoes { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 15px; cursor: pointer; font-weight: bold; border: none; border-radius: 4px; color: white; }
        .bg-azul { background: #004085; } .bg-verde { background: #28a745; } .bg-vermelho { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f1f3f5; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Histórico Salvo</h3>
        <div id="lista-historico">Carregando...</div>
    </div>
    <div class="main">
        <h2>Custo de Pessoal</h2>
        <div class="botoes">
            <select id="periodo-select"><option value="2026-TRIMESTRE-3">2026 - 3º Trimestre</option></select>
            <button class="bg-azul" id="btn-carregar">Verificar Análise</button>
            <button class="bg-verde" id="btn-salvar">Confirmar e Salvar</button>
            <button class="bg-verde" id="btn-exibir">Exibir Selecionado</button>
            <button class="bg-vermelho" id="btn-excluir">Excluir Selecionado</button>
            <button class="bg-azul" id="btn-pdf">Gerar PDF</button>
        </div>
        <h3>Custo de Pessoal x Limite da LRF</h3>
        <table>
            <tr><th>Indicador</th><th>Valor (R$)</th><th>% da RCL</th></tr>
            <tr><td>Receita Corrente Líquida (RCL)</td><td id="comp-rcl">0,00</td><td>100,00%</td></tr>
            <tr><td>(-) Custo de Pessoal</td><td id="comp-custo">0,00</td><td id="comp-pct-custo">0,00%</td></tr>
            <tr style="background:#f8f9fa"><td><b>(=) Margem Disponível</b></td><td id="comp-margem"><b>0,00</b></td><td id="comp-pct-margem"><b>0,00%</b></td></tr>
            <tr><td>Limite LRF</td><td id="comp-limite">0,00</td><td>50,00%</td></tr>
        </table>
    </div>
    <script>
        function fmt(v) { return Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
        function carregar() {
            fetch('/api/custo_pessoal/' + document.getElementById('periodo-select').value)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('comp-rcl').innerText = fmt(d.rcl_total);
                    document.getElementById('comp-custo').innerText = fmt(d.custo_total);
                    document.getElementById('comp-limite').innerText = fmt(d.rcl_total * 0.5);
                    document.getElementById('comp-margem').innerText = fmt((d.rcl_total * 0.5) - d.custo_total);
                    document.getElementById('comp-pct-custo').innerText = ((d.custo_total/d.rcl_total)*100).toFixed(2) + '%';
                    document.getElementById('comp-pct-margem').innerText = (((d.rcl_total * 0.5) - d.custo_total) / d.rcl_total * 100).toFixed(2) + '%';
                }).catch(e => alert('Erro de conexão.'));
        }
        function carregarHistorico() {
            fetch('/historico_custo_pessoal').then(r => r.json()).then(d => {
                let lista = document.getElementById('lista-historico');
                lista.innerHTML = '';
                if(!d || d.length === 0) { lista.innerText = 'Nenhum'; return; }
                d.forEach(item => {
                    let div = document.createElement('div');
                    div.innerHTML = `<input type="radio" name="hist" value="${item.id}"> ${item.periodo}`;
                    lista.appendChild(div);
                });
            });
        }
        function salvar() {
            fetch('/salvar_custo_pessoal/' + document.getElementById('periodo-select').value, {method: 'POST'})
                .then(() => { alert('Salvo com sucesso!'); carregarHistorico(); });
        }
        function exibirSelecionado() {
            let sel = document.querySelector('input[name="hist"]:checked');
            if(!sel) return alert('Selecione um item.');
            fetch('/historico_custo_pessoal/' + sel.value).then(r => r.json()).then(d => {
                document.getElementById('comp-rcl').innerText = fmt(d.rcl_total);
                document.getElementById('comp-custo').innerText = fmt(d.custo_total);
            });
        }
        function excluirSelecionado() {
            let sel = document.querySelector('input[name="hist"]:checked');
            if(!sel) return alert('Selecione um item.');
            if(confirm('Excluir?')) fetch('/excluir_custo_pessoal/' + sel.value, {method: 'DELETE'}).then(() => carregarHistorico());
        }
        function gerarPDF() {
            let sel = document.querySelector('input[name="hist"]:checked');
            window.open(sel ? '/gerar_pdf_custo_pessoal?id=' + sel.value : '/gerar_pdf_custo_pessoal', '_blank');
        }
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-carregar').onclick = carregar;
            document.getElementById('btn-salvar').onclick = salvar;
            document.getElementById('btn-exibir').onclick = exibirSelecionado;
            document.getElementById('btn-excluir').onclick = excluirSelecionado;
            document.getElementById('btn-pdf').onclick = gerarPDF;
            carregar(); carregarHistorico();
        });
    
        // Adiciona feedback visual aos botões
        const btnCarregar = document.getElementById('btn-carregar');
        const btnSalvar = document.getElementById('btn-salvar');

        if(btnCarregar) {
            const originalCarregar = btnCarregar.onclick;
            btnCarregar.onclick = function() {
                btnCarregar.innerText = 'Verificando...';
                btnCarregar.disabled = true;
                setTimeout(() => {
                    if(originalCarregar) originalCarregar.call(this);
                    btnCarregar.innerText = 'Verificar Análise';
                    btnCarregar.disabled = false;
                }, 500);
            };
        }

        if(btnSalvar) {
            const originalSalvar = btnSalvar.onclick;
            btnSalvar.onclick = function() {
                btnSalvar.innerText = 'Salvando...';
                btnSalvar.disabled = true;
                setTimeout(() => {
                    if(originalSalvar) originalSalvar.call(this);
                    btnSalvar.innerText = 'Confirmar e Salvar';
                    btnSalvar.disabled = false;
                }, 500);
            };
        }


        // Feedback visual instantâneo
        document.getElementById('btn-carregar').addEventListener('click', function() {
            this.innerText = 'Verificando...';
            setTimeout(() => this.innerText = 'Verificar Análise', 800);
        });
        document.getElementById('btn-salvar').addEventListener('click', function() {
            this.innerText = 'Salvando...';
            setTimeout(() => this.innerText = 'Confirmar e Salvar', 800);
        });

</script>
</body>
</html>
