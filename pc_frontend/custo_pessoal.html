<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custo de Pessoal - SIGPC</title>
    <style>
        body { font-family: Segoe UI, sans-serif; background-color: #f8f9fa; color: #333; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .sidebar { width: 250px; background-color: #fff; border-right: 1px solid #dee2e6; padding: 20px; overflow-y: auto; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .hdr h1 { font-size: 24px; color: #0a1c3a; margin: 0; }
        .botoes { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #fff; font-size: 14px; }
        .btn-voltar { background-color: #fd7e14; }
        .btn-azul { background-color: #004085; }
        .btn-verde { background-color: #28a745; }
        .btn-vermelho { background-color: #dc3545; }
        .btn-ciano { background-color: #17a2b8; }
        select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background-color: #e9ecef; }
        .linha-destaque { background-color: #f8f9fa; }
        .historico-item { padding: 10px; border-bottom: 1px solid #eee; }
        .texto-direita { text-align: right; }
        .texto-centro { text-align: center; }
        /* --- ESTILO DO CARD DE HISTÓRICO --- */
        .historico-item-card {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: #fff;
            cursor: pointer;
            transition: 0.2s;
        }
        .historico-item-card:hover { background-color: #f8f9fa; border-color: #004085; }
        .historico-item-card input[type="radio"] { margin-top: 4px; margin-right: 12px; cursor: pointer; }
        .historico-info { display: flex; flex-direction: column; }
        .historico-periodo { font-size: 15px; font-weight: bold; color: #004085; margin-bottom: 2px; }
        .historico-data { font-size: 12px; color: #6c757d; }
        .historico_item_card {
            display: flex; align-items: flex-start; padding: 12px;
            border: 1px solid #dee2e6; border-radius: 6px; margin-bottom: 10px;
            background-color: #fff; cursor: pointer; transition: 0.2s;
        }
        .historico_item_card:hover { background-color: #f8f9fa; border-color: #004085; }
        .historico_item_card input[type="radio"] { margin-top: 4px; margin-right: 12px; cursor: pointer; }
        .historico_info { display: flex; flex-direction: column; }
        .historico_periodo { font-size: 15px; font-weight: bold; color: #004085; margin-bottom: 2px; }
        .historico_data { font-size: 12px; color: #6c757d; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Histórico Salvo</h3> <button onclick="carregarHistorico()" style="font-size:12px; padding:5px 10px; cursor:pointer;">Recarregar</button>
        <div id="historico"><p style="color:#666; padding:10px;">Carregando...</p></div>
        <div id="lista-historico">Carregando...</div>
    </div>
    <div class="main">
        <div class="hdr">
            <h1>Custo de Pessoal</h1>
            <span style="color: #6c757d;">SIGPC</span>
        </div>
        <div class="botoes">
            <button class="btn btn-voltar" id="btn-voltar">← Voltar</button>
            <a href="/configuracoes" class="btn btn-ciano" style="text-decoration:none; display:inline-block; padding:10px 20px; margin-left:5px;">⚙️ Configurações</a>
            <select id="periodo-select"><option value="2026-TRIMESTRE-3">2026 - 3º Trimestre</option></select>
            <button class="btn btn-azul" id="btn-carregar">Verificar Análise</button>
            <button class="btn btn-verde" id="btn-salvar" onclick="salvarCusto()">Confirmar e Salvar</button>
            <button class="btn btn-verde" id="btn-exibir" onclick="exibirSelecionado()">Exibir Selecionado</button>
            <button class="btn btn-vermelho" id="btn-excluir" onclick="excluirSelecionado()">Excluir Selecionado</button>
            <button class="btn btn-azul" id="btn-pdf" onclick="gerarPDF()" >Gerar PDF (Resumo)</button>
            <button class="btn btn-ciano" id="btn-pdf-completo" onclick="gerarPDFCompleto()" >Gerar PDF (Completo)</button>
        </div>
        <table>
            <tr><th>Indicador</th><th class="texto-direita">Valor (R\$)</th><th class="texto-centro">% da RCL</th></tr>
            <tr><td>RCL</td><td id="comp-rcl" class="texto-direita">0,00</td><td class="texto-centro">100,00%</td></tr>
            <tr><td>(-) Custo</td><td id="comp-custo" class="texto-direita">0,00</td><td id="comp-pct-custo" class="texto-centro">0,00%</td></tr>
            <tr class="linha-destaque"><td>(=) Margem</td><td id="comp-margem" class="texto-direita">0,00</td><td id="comp-pct-margem" class="texto-centro">0,00%</td></tr>
            <tr><td>Limite Resolução Cofen 814/2026</td><td id="comp-limite" class="texto-direita">0,00</td><td id="comp-limite-pct" class="texto-centro">50,00%</td></tr>
        </table>
    </div>
<script>
        function carregar() {
            console.log("[CARREGAR] Iniciando...");
            var periodo = document.getElementById('periodo-select').value;
            var url = '/api/custo_pessoal/' + periodo + '?t=' + Date.now();
            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    console.log("[CARREGAR] Dados:", d);
                    // Atualizar a tabela
                    var rcl = parseFloat(d.rcl_total || 0);
                    var custo = parseFloat(d.custo_total || 0);
                    var limite = parseFloat(d.limite_atual || (rcl * 0.5));
                    var margem = parseFloat(d.margem_disponivel_atual || (limite - custo));
                    var limite_pct = d.limite_pct || 0.5;
                    var fmt = function(v) { return (v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}); };
                    var pct = function(parte, total) { return total ? ((parte/total)*100).toFixed(2) + '%' : '0,00%'; };
                    document.getElementById('comp-rcl').textContent = fmt(rcl);
                    document.getElementById('comp-custo').textContent = fmt(custo);
                    document.getElementById('comp-limite').textContent = fmt(limite);
                    document.getElementById('comp-margem').innerHTML = '<b>' + fmt(margem) + '</b>';
                    document.getElementById('comp-pct-custo').textContent = pct(custo, rcl);
                    document.getElementById('comp-pct-margem').innerHTML = '<b>' + pct(margem, rcl) + '</b>';
                    // Atualizar o percentual do limite
                    var pctEl = document.getElementById('comp-limite-pct');
                    if (pctEl) pctEl.textContent = (limite_pct * 100).toFixed(2) + '%';
                    console.log("[CARREGAR] Tabela atualizada!");
                })
                .catch(function(e) {
                    console.error("[CARREGAR] Erro:", e);
                    alert('Erro: ' + e.message);
                });
        }
        window.onload = function() {
            console.log("[ONLOAD] Pagina carregada");
            carregar();
        };
        // === FUNCOES DOS BOTOES ===
        function salvarCusto() {
            var periodo = document.getElementById('periodo-select').value;
            fetch('/salvar_custo_pessoal/' + periodo, {method: 'POST'})
                .then(r => r.json())
                .then(d => { alert('Custo salvo com sucesso!'); carregarHistorico(); })
                .catch(e => alert('Erro ao salvar: ' + e.message));
        }
        function exibirSelecionado() {
            var check = document.querySelector('.check-historico:checked');
            if (!check) { alert('Selecione um item no historico.'); return; }
            fetch('/historico_custo_pessoal/' + check.value)
                .then(r => r.json())
                .then(d => {
                    if (d.dados) {
                        document.getElementById('periodo-select').value = d.periodo || '2026-TRIMESTRE-3';
                        carregar();
                    }
                })
                .catch(e => alert('Erro ao carregar historico: ' + e.message));
        }
        function excluirSelecionado() {
            var checks = document.querySelectorAll('.check-historico:checked');
            if (checks.length === 0) { alert('Selecione pelo menos um item.'); return; }
            var promessas = [];
            checks.forEach(c => {
                promessas.push(fetch('/excluir_custo_pessoal/' + c.value, {method: 'DELETE'}).then(r => r.ok).catch(() => false));
            });
            Promise.all(promessas).then(results => {
                if (results.some(r => r === true)) { alert('Excluido!'); carregarHistorico(); }
            });
        }
        function gerarPDF() {
            var check = document.querySelector('.check-historico:checked');
            if (!check) { 
                alert('Selecione um historico antes de gerar o PDF.'); 
                return; 
            }
            window.open('/gerar_pdf_custo_pessoal?id=' + check.value, '_blank');
        }
        function gerarPDFCompleto() {
            var check = document.querySelector('.check-historico:checked');
            if (!check) { 
                alert('Selecione um historico antes de gerar o PDF.'); 
                return; 
            }
            window.open('/gerar_pdf_completo_custo_pessoal?id=' + check.value, '_blank');
        }
        function carregarHistorico() {
            fetch('/historico_custo_pessoal')
                .then(r => r.json())
                .then(data => {
                    var div = document.getElementById('historico');
                    if (!div) return;
                    if (!data || data.length === 0) {
                        div.innerHTML = '<p style="color:#666;">Nenhum historico salvo.</p>';
                        return;
                    }
                    var html = '';
                    data.forEach(item => {
                        html += '<div style="padding:10px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:8px;">';
                        html += '<input type="checkbox" class="check-historico" value="' + item.id + '" style="cursor:pointer;">';
                        html += '<div>';
                        html += '<b>' + item.periodo + '</b><br>';
                        html += '<small style="color:#666;">' + (item.data_geracao || '') + '</small>';
                        html += '</div></div>';
                    });
                    div.innerHTML = html;
                })
                .catch(e => console.error('Erro ao carregar historico:', e));
        }
</script>
    <div id="debug-info" style="margin: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; font-family: monospace; font-size: 12px; display: none;">
        <b>Debug:</b> <span id="debug-text">Aguardando...</span>
    </div>
    <script>
        // Funcao de debug visivel
        function mostrarDebug(msg) {
            var el = document.getElementById('debug-info');
            var txt = document.getElementById('debug-text');
            if (el && txt) {
                el.style.display = 'block';
                txt.innerText = msg;
            }
        }
        // Interceptar erros
        window.onerror = function(msg, url, line) {
            mostrarDebug('ERRO: ' + msg + ' (linha ' + line + ')');
            return false;
        };
    </script>
    </body>
</html>
