<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><title>Composição de Receitas e Despesas</title>

<style>
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6f9;padding:20px;margin:0;color:#333}
.btn{padding:8px 18px;border:none;border-radius:4px;color:#fff;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;font-size:13px}
.hdr-sub{color:#4a90e2;font-size:13px;text-transform:uppercase;letter-spacing:2px;font-weight:bold;margin-bottom:6px}
.hdr-tit{color:#003366;font-size:30px;font-weight:bold;margin-bottom:20px}
.topbar{display:flex;gap:8px;margin-bottom:15px}
.filtros{background:#fff;padding:12px;border-radius:6px;border:1px solid #cbd5e1;margin-bottom:15px;display:flex;gap:10px;align-items:center}
.layout{display:flex;gap:20px;align-items:flex-start}
.side{width:240px;background:#fff;padding:12px;border-radius:6px;border:1px solid #cbd5e1;flex-shrink:0}
.side h3{margin-top:0;font-size:15px}
#historico-lista{list-style:none;padding:0;margin:0}
#historico-lista li{margin-bottom:8px;border-bottom:1px solid #eee;padding-bottom:4px;font-size:13px}
.main{flex:1;min-width:0}
.tab{background:#fff;border-radius:6px;border:1px solid #cbd5e1;overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#003366;color:#fff;padding:12px;text-align:center;border:1px solid #002244;font-size:12px}
td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right;font-family:Consolas,monospace}
td:first-child{font-weight:bold;text-align:left;font-family:'Segoe UI',Arial,sans-serif}
tr:nth-child(even){background:#f8fbff}
.pos{color:#28a745}.neg{color:#dc3545}
.graf-box{background:#fff;padding:20px;border-radius:6px;border:1px solid #cbd5e1}
h3.secao{color:#003366;margin:15px 0 8px 0;font-size:16px}
</style>
<style id="css-tabela-align">
#tab-receitas, #tab-despesas { table-layout: fixed; width: 100%; }
#tab-receitas th:nth-child(1), #tab-despesas th:nth-child(1) { width: 35%; text-align: left; }
#tab-receitas th:nth-child(2), #tab-despesas th:nth-child(2) { width: 20%; text-align: right; }
#tab-receitas th:nth-child(3), #tab-despesas th:nth-child(3) { width: 20%; text-align: right; }
#tab-receitas th:nth-child(4), #tab-despesas th:nth-child(4) { width: 15%; text-align: center; }
#tab-receitas td:nth-child(1), #tab-despesas td:nth-child(1) { text-align: left; font-weight: 500; }
#tab-receitas td:nth-child(2), #tab-despesas td:nth-child(2) { text-align: right; font-family: Consolas, monospace; }
#tab-receitas td:nth-child(3), #tab-despesas td:nth-child(3) { text-align: right; font-family: Consolas, monospace; }
#tab-receitas td:nth-child(4), #tab-despesas td:nth-child(4) { text-align: center; font-weight: bold; }
</style>
</head>
<body>
<div class="topbar">
<a href="/" class="btn" style="background:#ff7f00">&#8592; Voltar</a>
<button id="btn-exibir-composicao" class="btn" style="background:#28a745">Exibir</button>
<button class="btn" style="background:#dc3545" onclick="excluirSelecionado()">Excluir</button>
<button class="btn" style="background:#0056b3" onclick="gerarPDFHistorico()">Gerar PDF</button>
</div>
<div class="hdr-sub">Composição</div>
<div class="hdr-tit">Receitas e Despesas Comparativas</div>
<div class="filtros" style="flex-wrap:wrap;gap:12px">
<div style="display:flex;gap:6px;align-items:center;padding:8px;border:1px solid #cbd5e1;border-radius:4px;background:#f0f9ff">
<strong style="color:#003366;font-size:12px">ATUAL:</strong>
<select id="ano_atual"><option>2026</option><option>2025</option></select>
<select id="tipo_atual">
<option value="TRIMESTRE">Trimestre</option>
<option value="MES">Mês</option>
<option value="EXERCICIO">Exercício</option>
</select>
<select id="val_atual">
<option value="3">3º Trimestre</option>
<option value="1">1º Trimestre</option>
<option value="2">2º Trimestre</option>
<option value="4">4º Trimestre</option>
</select>
</div>
<button class="btn" style="background:#0056b3" onclick="carregar()">Verificar</button>
<button class="btn" style="background:#28a745" onclick="salvarComposicao()">Confirmar e Salvar</button>
</div>
<div class="layout">
<div class="side">
<h3>Histórico Salvo</h3>
<ul id="historico-lista"><li>Carregando...</li></ul>
</div>
<div class="main">
<h3 class="secao">Receitas — comparativo (R$ mil)</h3>
<div class="tab">
<table id="tab-receitas">
<thead><tr><th>Conta</th><th>Período Atual</th><th>Período Anterior</th><th>Var. (%)</th></tr></thead>
<tbody><tr><td colspan="4" style="text-align:center">Clique em Verificar</td></tr></tbody>
</table>
</div>
<h3 class="secao">Despesas — comparativo (R$ mil)</h3>
<div class="tab">
<table id="tab-despesas">
<thead><tr><th>Conta</th><th>Período Atual</th><th>Período Anterior</th><th>Var. (%)</th></tr></thead>
<tbody><tr><td colspan="4" style="text-align:center">Clique em Verificar</td></tr></tbody>
</table>
</div>
<div class="graf-box">
<canvas id="graf" style="min-height:350px"></canvas>
</div>
</div>
</div>


    











<script>

// ========== FUNCOES DA COMPOSICAO ==========
let chart = null;


function carregar() {
    const ano = document.getElementById('ano_atual').value;
    const tipo = document.getElementById('tipo_atual').value;
    const val = document.getElementById('val_atual').value;
    
    const pAtual = ano + '-' + tipo + '-' + val;
    const pAnterior = String(parseInt(ano) - 1) + '-' + tipo + '-' + val;
    
    // Limpa as tabelas
    document.querySelector('#tab-receitas tbody').innerHTML = '<tr><td colspan="4" style="text-align:center;">Buscando dados...</td></tr>';
    document.querySelector('#tab-despesas tbody').innerHTML = '<tr><td colspan="4" style="text-align:center;">Buscando dados...</td></tr>';
    
    Promise.all([
        fetch('/api/composicao_receitas_despesas/' + pAtual).then(r => r.json()),
        fetch('/api/composicao_receitas_despesas/' + pAnterior).then(r => r.json())
    ]).then(([a, b]) => {
        // Verifica se o backend retornou erro ou lista vazia
        if (a.erro || !a.receitas || Object.keys(a.receitas).length === 0) {
            alert("Aviso: Não há dados importados para o período atual (" + pAtual + "). Verifique se os relatórios foram importados.");
            document.querySelector('#tab-receitas tbody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#856404;">Nenhum dado para o período.</td></tr>';
            document.querySelector('#tab-despesas tbody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#856404;">Nenhum dado para o período.</td></tr>';
            return;
        }
        if (b.erro || !b.receitas || Object.keys(b.receitas).length === 0) {
            alert("Aviso: Não há dados importados para o período anterior (" + pAnterior + "). Verifique se os relatórios foram importados.");
            return;
        }
        
        renderTabela('tab-receitas', a.receitas, b.receitas);
        renderTabela('tab-despesas', a.despesas, b.despesas);
        renderChart(a, b);
    }).catch(e => {
        alert("Erro ao verificar dados: " + e.message);
        console.error(e);
    });
}

function fmtV(v) { return (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function pct(va, vb) { if (!vb || vb === 0) return '-'; const v = ((va - vb) / Math.abs(vb)) * 100; return (v >= 0 ? '+' : '') + v.toFixed(2).replace('.', ',') + '%'; }

function renderTabela(id, at, ant) {
    const tb = document.querySelector('#' + id + ' tbody');
    if (!tb) return;
    let html = '';
    Object.keys(at).forEach(function(k) {
        const va = at[k] || 0, vb = ant[k] || 0;
        const v = pct(va, vb);
        const cls = v.startsWith('-') ? 'neg' : 'pos';
        html += '<tr><td>' + k + '</td><td>' + fmtV(va) + '</td><td>' + fmtV(vb) + '</td><td class="' + cls + '">' + v + '</td></tr>';
    });
    tb.innerHTML = html;
}

function renderChart(atual, anterior) {
    const canvas = document.getElementById('graf');
    if (!canvas) return;

    // Verifica se o Chart.js carregou. Se nao, espera um pouco e tenta de novo.
    if (typeof Chart === 'undefined') {
        console.warn("Chart.js ainda nao carregou. Tentando novamente em 500ms...");
        setTimeout(function() { renderChart(atual, anterior); }, 500);
        return;
    }

    if (chart) { chart.destroy(); chart = null; }
    const labels = Object.keys(atual.receitas || {});
    const dataA = labels.map(k => atual.receitas[k] || 0);
    const dataB = labels.map(k => (anterior.receitas || {})[k] || 0);
    
    try {
        chart = new Chart(canvas, {
            type: 'bar',
            data: { labels: labels, datasets: [
                { label: 'Período Atual', data: dataA, backgroundColor: '#003366', borderRadius: 4 },
                { label: 'Período Anterior', data: dataB, backgroundColor: '#4a90e2', borderRadius: 4 }
            ]},
            options: { responsive: true, maintainAspectRatio: false,
                plugins: { title: { display: true, text: 'Composição de Receitas (R$ mil)', font: { size: 14, weight: 'bold' }, color: '#003366' }, legend: { position: 'bottom' } },
                scales: { y: { beginAtZero: true, grid: { color: '#eef2f7' } } }
            }
        });
    } catch (e) {
        console.error("Erro ao renderizar o grafico:", e);
    }
}

function carregarHistorico() {
    fetch('/historico_composicao_receitas_despesas')
        .then(r => r.json())
        .then(data => {
            const el = document.getElementById('historico-lista');
            if (!el) return;
            if (!data || data.length === 0) { el.innerHTML = '<li>Nenhum histórico.</li>'; return; }
            let html = '';
            data.forEach(item => {
                html += `<li><label><input type="checkbox" class="check-hist" value="${item.id}" style="margin-right:5px;"><strong>${item.periodo}</strong><br><small style="color:#666;">${item.data_geracao}</small></label></li>`;
            });
            el.innerHTML = html;
        })
        .catch(e => { console.error("Erro no historico:", e); const el = document.getElementById('historico-lista'); if (el) el.innerHTML = '<li>Erro ao carregar.</li>'; });
}

function exibirSelecionado() {
    const check = document.querySelector('.check-hist:checked');
    if (!check) { alert("Selecione um item no histórico."); return; }
    
    fetch('/historico_composicao_receitas_despesas/' + check.value)
        .then(r => { 
            if (!r.ok) throw new Error("Erro HTTP " + r.status); 
            return r.json(); 
        })
        .then(dados => {
            const atual = dados.atual || {};
            const anterior = dados.anterior || {};
            
            // 1. Renderiza as Tabelas (se der erro aqui, avisa)
            try {
                if (atual.receitas && anterior.receitas) renderTabela('tab-receitas', atual.receitas, anterior.receitas);
                if (atual.despesas && anterior.despesas) renderTabela('tab-despesas', atual.despesas, anterior.despesas);
            } catch (e) {
                console.error("Erro ao renderizar tabelas:", e);
            }
            
            // 2. Renderiza o Grafico (se der erro, só avisa no console, NAO trava a tela)
            try {
                renderChart(atual, anterior);
            } catch (e) {
                console.warn("O grafico nao pode ser carregado agora:", e.message);
            }
        })
        .catch(e => { 
            alert("Erro ao carregar histórico: " + e.message); 
            console.error(e); 
        });
}

function salvarComposicao() {
    const ano = document.getElementById('ano_atual').value;
    const tipo = document.getElementById('tipo_atual').value;
    const val = document.getElementById('val_atual').value;
    const pAtual = ano + '-' + tipo + '-' + val;
    const pAnterior = String(parseInt(ano) - 1) + '-' + tipo + '-' + val;
    fetch('/salvar_composicao_receitas_despesas/' + pAtual + '/' + pAnterior, { method: 'POST' })
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(res => { alert("Relatório salvo com sucesso!"); carregarHistorico(); })
        .catch(e => { alert("Erro ao salvar: " + e.message); console.error(e); });
}

document.addEventListener("DOMContentLoaded", function() {
    carregarHistorico();
    const btnExibir = document.getElementById('btn-exibir-composicao');
    if (btnExibir) btnExibir.addEventListener('click', exibirSelecionado);
    const btnSalvar = document.querySelector('button[onclick="salvarComposicao()"]');
    if (btnSalvar) { btnSalvar.removeAttribute('onclick'); btnSalvar.addEventListener('click', salvarComposicao); }
});


function gerarPDFHistorico() {
    const check = document.querySelector('.check-hist:checked');
    if (!check) { 
        alert("Selecione um item no histórico para gerar o PDF."); 
        return; 
    }
    // Abre a rota de PDF em uma nova aba (o backend vai gerar e devolver o arquivo)
    window.open('/gerar_pdf_composicao_receitas_despesas/' + check.value, '_blank');
}

</script>
</body></html>
