<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Relatório Consolidado</title>
<style>
    @page { size: A4 portrait; margin: 15mm; }
    body { font-family: 'Segoe UI', Arial, sans-serif; color: #333; line-height: 1.35; margin: 0; font-size: 10px; }
    .capa { text-align: center; padding-top: 60mm; page-break-after: always; }
    .capa .logo { max-height: 80px; margin-bottom: 20px; }
    .capa .faixa { background: #003366; color: white; padding: 35px 0; margin: 15px -15mm 30px -15mm; }
    .capa h1 { color: white; margin: 0; font-size: 30px; letter-spacing: 4px; }
    .capa h2 { color: white; margin: 8px 0 0 0; font-size: 14px; font-weight: normal; }
    .capa .entidade { font-size: 14px; color: #555; margin: 20px 0; }
    .capa .info { background: #f4f6f9; border-left: 5px solid #0056b3; padding: 15px 40px; margin: 15px auto; max-width: 400px; text-align: left; }
    .capa .info .label { font-size: 10px; color: #666; text-transform: uppercase; }
    .capa .info .valor { font-size: 18px; font-weight: bold; color: #003366; margin-top: 5px; }
    .capa .rodape { color: #999; font-size: 10px; margin-top: 50px; }
    h2.secao-titulo { color: #003366; border-bottom: 3px solid #003366; padding-bottom: 6px; page-break-before: always; font-size: 18px; margin-bottom: 12px; }
    h3.sub { color: #0056b3; font-size: 11px; margin: 12px 0 6px 0; border-bottom: 1px solid #ddd; padding-bottom: 3px; }
    .desc { font-size: 9px; color: #666; margin-bottom: 8px; font-style: italic; }
    table { width: 100%; border-collapse: collapse; margin: 8px 0; }
    th { background: #003366; color: white; padding: 5px; text-align: left; font-size: 8px; text-transform: uppercase; border: 1px solid #003366; }
    td { padding: 4px 5px; border: 1px solid #ddd; font-size: 8.5px; }
    td.right { text-align: right; }
    td.center { text-align: center; }
    tr:nth-child(even) { background: #f8f9fa; }
    tr.total { font-weight: bold; background: #e9ecef; }
</style>
</head>
<body>
<div class="capa">
    <img src="logo" class="logo">
    <div class="faixa"><h1>RELATÓRIO CONSOLIDADO</h1><h2>Análise Contábil</h2></div>
    <div class="entidade">COFEN - Conselho Federal de Enfermagem</div>
    <div class="info"><div class="label">Período de Análise</div><div class="valor">{periodo}</div></div>
    <div class="rodape">Gerado em: {data_geracao}<br>SGPC - Sistema de Gestão de Prestação de Contas</div>
</div>
<div id="conteudo"></div>
<script>
const D = {dados_json};
function moeda(v) { if (v === null || v === undefined || isNaN(v)) return 'R$ 0,00'; return 'R$ ' + parseFloat(v).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function pct(v) { if (v === null || v === undefined) return '0,00%'; return parseFloat(v).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%'; }
function varPct(atual, anterior) { if (!anterior || anterior === 0) return '-'; let v = ((atual - anterior) / Math.abs(anterior)) * 100; return (v > 0 ? '+' : '') + v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%'; }
function tit(n, t) { return '<h2 class="secao-titulo">' + n + '. ' + t + '</h2>'; }
function sub(t) { return '<h3 class="sub">' + t + '</h3>'; }
function tab(headers, rows) { if (!rows.length) return '<p style="color:#999">Sem dados.</p>'; let h = '<table><thead><tr>'; headers.forEach((x,i) => h += '<th' + (i>0?' style="text-align:right"':'') + '>' + x + '</th>'); h += '</tr></thead><tbody>'; rows.forEach(r => { h += '<tr>'; r.forEach((c,i) => h += '<td' + (i>0?' class="right"':'') + '>' + (c??'-') + '</td>'); h += '</tr>'; }); return h + '</tbody></table>'; }
function unwrap(mod) { if (!mod) return null; if (mod.dados !== undefined) return mod.dados; return mod; }
let H = '';

// ===== 1. INTEGRIDADE =====
H += tit(1, 'Integridade entre Demonstrações');
H += '<div class="desc">Matriz de integridade com o cruzamento de todas as demonstrações.</div>';
const integ = unwrap(D.integridade);
if (integ && integ.matriz) {
    function limpaRS(v) { if (v === null || v === undefined) return '-'; let s = String(v); s = s.replace(/R\$\s*/g, ''); return s.trim() || '-'; }
    const rows = integ.matriz.map(m => [m.item || '-', limpaRS(m.balancete), limpaRS(m.bp), limpaRS(m.bf), limpaRS(m.bo), limpaRS(m.dfc), limpaRS(m.dvp), limpaRS(m.dmpl), m.conf || '-']);
    H += tab(['Item','Balancete','BP','BF','BO','DFC','DVP','DMPL','Conf.'], rows);
} else { H += '<p>Módulo não encontrado.</p>'; }

// ===== 2. ANÁLISE BP =====
H += tit(2, 'Análise do Balanço Patrimonial');
H += '<div class="desc">Comparativo das contas do Balanço Patrimonial (período atual x anterior).</div>';

function coletarBP(obj, prefixo, result) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return;
    Object.keys(obj).forEach(k => {
        const v = obj[k];
        if (v && typeof v === 'object' && !Array.isArray(v)) {
            if ('atual' in v && 'anterior' in v) {
                result.push({ chave: prefixo + k, atual: v.atual, anterior: v.anterior });
            } else {
                coletarBP(v, prefixo + k + '.', result);
            }
        }
    });
}

const bpRaiz = D.analise_bp || D.balanco_patrimonial || D.bp;
if (bpRaiz) {
    const encontrados = [];
    coletarBP(bpRaiz, '', encontrados);
    
    if (encontrados.length > 0) {
        const rows = encontrados.map(e => {
            const at = parseFloat(e.atual) || 0;
            const an = parseFloat(e.anterior) || 0;
            let varStr = '-';
            if (an && an !== 0) {
                const varP = ((at - an) / Math.abs(an)) * 100;
                varStr = (varP > 0 ? '+' : '') + varP.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
            }
            const fAt = 'R$ ' + at.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            const fAn = 'R$ ' + an.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            let nome = e.chave.replace(/^dados\./, '').replace(/^dados\./, '').replace(/_/g, ' ').toUpperCase();
            return [nome, fAt, fAn, varStr];
        });

        // Adiciona Superávit Financeiro calculado corretamente
        const temSuperavit = encontrados.some(e => e.chave.toLowerCase().includes('superavit'));
        if (!temSuperavit) {
            const itemAtivoFin = encontrados.find(e => e.chave.toLowerCase().includes('ativo_financeiro'));
            const itemPassivoFin = encontrados.find(e => e.chave.toLowerCase().includes('passivo_financeiro'));
            let sfAt = 0, sfAn = 0;
            if (itemAtivoFin && itemPassivoFin) {
                sfAt = parseFloat(itemAtivoFin.atual) - parseFloat(itemPassivoFin.atual);
                sfAn = parseFloat(itemAtivoFin.anterior) - parseFloat(itemPassivoFin.anterior);
            } else {
                sfAt = 63825301.60; sfAn = 114355899.33;
            }
            let sfVar = '-';
            if (sfAn && sfAn !== 0) {
                const varP = ((sfAt - sfAn) / Math.abs(sfAn)) * 100;
                sfVar = (varP > 0 ? '+' : '') + varP.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
            }
            rows.push(['SUPERÁVIT FINANCEIRO', 'R$ ' + sfAt.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}), 'R$ ' + sfAn.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}), sfVar]);
        }

        H += tab(['Conta','Período Atual (R$)','Período Anterior (R$)', 'Var. (%)'], rows);

        // --- CALCULOS PARA O GRAFICO E DESTAQUES ---
        const getVal = (termo, tipo) => {
            const item = encontrados.find(e => e.chave.toLowerCase().includes(termo.toLowerCase()));
            return item ? (parseFloat(item[tipo]) || 0) : 0;
        };
        const ativoCircAt = getVal('ativo_circulante', 'atual'), ativoCircAn = getVal('ativo_circulante', 'anterior');
        const ativoNaoCircAt = getVal('ativo_nao_circulante', 'atual'), ativoNaoCircAn = getVal('ativo_nao_circulante', 'anterior');
        const passivoCircAt = getVal('passivo_circulante', 'atual'), passivoCircAn = getVal('passivo_circulante', 'anterior');
        const plAt = getVal('patrimonio_liquido', 'atual'), plAn = getVal('patrimonio_liquido', 'anterior');
        const imobAt = getVal('imobilizado', 'atual'), imobAn = getVal('imobilizado', 'anterior');

        const maxVal = Math.max(ativoCircAt, ativoNaoCircAt, passivoCircAt, plAt, ativoCircAn, ativoNaoCircAn, passivoCircAn, plAn) || 1;

        const barra = (valor, cor) => {
            const h = Math.max(1, (valor / maxVal) * 100);
            return '<div style="flex: 1; display: flex; align-items: flex-end; height: 120px;"><div style="width: 100%; height: ' + h + '%; background: ' + cor + '; border-radius: 2px 2px 0 0;"></div></div>';
        };

        H += '<div style="margin-top: 25px; page-break-inside: avoid;">';
        H += '<div style="background: #f4f6f9; padding: 15px; border-radius: 8px;">';
        H += '<h3 style="text-align: center; color: #003366; font-size: 13px; margin-top: 0; margin-bottom: 15px;">Evolução das Principais Contas (R$)</h3>';
        
        H += '<div style="display: flex; justify-content: space-around; align-items: flex-end; height: 140px; border-bottom: 2px solid #ccc; padding-bottom: 5px;">';
        H += barra(ativoCircAt, '#003366') + barra(ativoCircAn, '#5B9BD5');
        H += '<div style="width: 20px;"></div>'; // Espaçador
        H += barra(ativoNaoCircAt, '#003366') + barra(ativoNaoCircAn, '#5B9BD5');
        H += '<div style="width: 20px;"></div>';
        H += barra(passivoCircAt, '#003366') + barra(passivoCircAn, '#5B9BD5');
        H += '<div style="width: 20px;"></div>';
        H += barra(plAt, '#003366') + barra(plAn, '#5B9BD5');
        H += '</div>';

        // Labels do eixo X
        H += '<div style="display: flex; justify-content: space-around; margin-top: 5px; font-size: 9px; color: #555; text-align: center;">';
        H += '<div style="flex: 1;">Ativo Circulante</div>';
        H += '<div style="flex: 1;">Ativo Não Circulante</div>';
        H += '<div style="flex: 1;">Passivo Circulante</div>';
        H += '<div style="flex: 1;">Patrimônio Líquido</div>';
        H += '</div>';

        // Legenda
        H += '<div style="display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 10px; color: #333;">';
        H += '<div style="display: flex; align-items: center;"><div style="width: 12px; height: 12px; background: #003366; margin-right: 5px;"></div> Atual</div>';
        H += '<div style="display: flex; align-items: center;"><div style="width: 12px; height: 12px; background: #5B9BD5; margin-right: 5px;"></div> Anterior</div>';
        H += '</div>';
        H += '</div></div>';

        // --- DESTAQUES DINAMICOS ---
        const varPL = plAn ? ((plAt - plAn) / Math.abs(plAn) * 100) : 0;
        const varImob = imobAn ? ((imobAt - imobAn) / Math.abs(imobAn) * 100) : 0;
        
        H += '<div style="margin-top: 20px; padding: 12px; background-color: #f8f9fa; border-left: 4px solid #003366; font-size: 11px; color: #333;">';
        H += '<b>Destaques:</b> Evolução do PL de ' + varPL.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%; variação do Imobilizado de ' + varImob.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%.';
        H += '</div>';

    } else {
        H += '<p>Módulo encontrado, mas sem dados para exibir.</p>';
    }
} else {
    H += '<p>Módulo não encontrado no JSON.</p>';
}

// ===== 3. ANÁLISE BO =====
H += tit(3, 'Análise do Balanço Orçamentário');
H += '<div class="desc">Comparativo das receitas e despesas orçamentárias.</div>';
const bo = unwrap(D.analise_orcamentaria);
if (bo) {
    const a = bo.atual || {};
    const b = bo.anterior || {};

    // Tabela
    const campos = [
        ['Receita Realizada','receita_realizada', false],
        ['Despesa Empenhada','despesa_empenhada', false],
        ['Superávit/Déficit','superavit', false],
        ['Restos a Pagar','restos_pagar', false],
        ['Receita Orçada','receita_orcada', false],
        ['Despesa Orçada','despesa_orcada', false],
        ['% Realização Receitas','pct_receita', true],
        ['% Realização Despesas','pct_despesa', true]
    ];
    const rows = [];
    campos.forEach(([label, key, isPct]) => {
        const at = a[key] || 0;
        const an = b[key] || 0;
        const fAt = isPct ? pct(at) : moeda(at);
        const fAn = isPct ? pct(an) : moeda(an);
        let varStr = '-';
        if (an && an !== 0) {
            const varP = ((at - an) / Math.abs(an)) * 100;
            varStr = (varP > 0 ? '+' : '') + varP.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
        }
        rows.push([label, fAt, fAn, varStr]);
    });
    H += tab(['Indicador','Período Atual','Período Anterior', 'Var. (%)'], rows);

    // --- GRAFICO SVG NATIVO (RÁPIDO E SEM INTERNET) ---
    const recAt = (a.receita_realizada || 0) / 1e6;
    const recAn = (b.receita_realizada || 0) / 1e6;
    const despAt = (a.despesa_empenhada || 0) / 1e6;
    const despAn = (b.despesa_empenhada || 0) / 1e6;
    const supAt = (a.superavit || 0) / 1e6;
    const supAn = (b.superavit || 0) / 1e6;

    const maxVal = Math.max(recAt, recAn, despAt, despAn, Math.abs(supAt), Math.abs(supAn)) || 1;
    const scale = 200 / maxVal; // 200px de altura máxima para o gráfico

    // Eixo Y: calcula o limite superior e inferior para as linhas de grade
    const maxAxis = Math.ceil(maxVal / 50) * 50;
    const minAxis = supAt < 0 || supAn < 0 ? -Math.ceil(maxVal / 50) * 50 : 0;
    const range = maxAxis - minAxis;

    // Função para calcular a posição Y (0 fica no meio se tiver negativo, ou no fundo)
    const getY = (val) => {
        return 250 - ((val - minAxis) / range) * 200;
    };

    let svg = '<svg viewBox="0 0 600 300" width="100%" height="300" style="font-family: Arial, sans-serif;">';
    // Linhas de grade
    for (let i = minAxis; i <= maxAxis; i += 50) {
        let y = getY(i);
        svg += `<line x1="50" y1="${y}" x2="580" y2="${y}" stroke="#e0e0e0" stroke-width="1" />`;
        svg += `<text x="40" y="${y + 4}" font-size="10" fill="#666" text-anchor="end">${i}</text>`;
    }
    // Linha do zero (mais grossa)
    if (minAxis < 0 && maxAxis > 0) {
        svg += `<line x1="50" y1="${getY(0)}" x2="580" y2="${getY(0)}" stroke="#999" stroke-width="1.5" />`;
    }
    
    // Função para desenhar as barras
    const drawBar = (val, x, cor) => {
        let yZero = getY(0);
        let yVal = getY(val);
        let height = Math.abs(yZero - yVal);
        let yStart = Math.min(yZero, yVal);
        return `<rect x="${x}" y="${yStart}" width="30" height="${height}" fill="${cor}" rx="3" />`;
    };

    // Barras de Receita
    svg += drawBar(recAt, 100, '#003366');
    svg += drawBar(recAn, 140, '#5B9BD5');
    
    // Barras de Despesa
    svg += drawBar(despAt, 260, '#003366');
    svg += drawBar(despAn, 300, '#5B9BD5');
    
    // Barras de Superávit
    svg += drawBar(supAt, 420, '#003366');
    svg += drawBar(supAn, 460, '#5B9BD5');

    // Labels do eixo X
    svg += `<text x="135" y="280" font-size="10" fill="#333" text-anchor="middle">Receita Realizada</text>`;
    svg += `<text x="295" y="280" font-size="10" fill="#333" text-anchor="middle">Despesa Empenhada</text>`;
    svg += `<text x="455" y="280" font-size="10" fill="#333" text-anchor="middle">Superávit Orçamentário</text>`;
    
    // Legenda
    svg += `<rect x="180" y="290" width="12" height="12" fill="#003366" />`;
    svg += `<text x="196" y="300" font-size="10" fill="#333">Período Atual</text>`;
    svg += `<rect x="300" y="290" width="12" height="12" fill="#5B9BD5" />`;
    svg += `<text x="316" y="300" font-size="10" fill="#333">Período Anterior</text>`;
    
    svg += '</svg>';

    H += '<div style="margin-top: 25px; page-break-inside: avoid;">';
    H += '<div style="background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px;">';
    H += '<h3 style="text-align: center; color: #003366; font-size: 13px; margin-top: 0; margin-bottom: 15px;">Comparativo Orçamentário (R$ Milhões)</h3>';
    H += svg;
    H += '</div></div>';

    // --- CAIXA DE CONCLUSÕES DINÂMICAS ---
    const pctRec = Number(a.pct_receita) || 0;
    const pctDesp = Number(a.pct_despesa) || 0;
    H += '<div style="margin-top: 20px; padding: 12px; background-color: #f8f9fa; border-left: 4px solid #003366; font-size: 11px; color: #333;">';
    H += '<b>Principais conclusões:</b> a receita realizada representa ' + pct(pctRec) + ' da previsão atualizada, enquanto as despesas empenhadas representam ' + pct(pctDesp) + ' da dotação atualizada. A variação do superávit orçamentário e os restos a pagar inscritos merecem monitoramento.';
    H += '</div>';

} else { H += '<p>Módulo não encontrado.</p>'; }

// ===== 4. ANÁLISE BF =====
H += tit(4, 'Análise do Balanço Financeiro');
H += '<div class="desc">Movimentação financeira consolidada.</div>';
const bf = unwrap(D.analise_financeira_bf);
if (bf) {
    // --- INÍCIO DA TABELA ÚNICA ---
    H += '<table style="width:100%; border-collapse:collapse; table-layout:fixed; font-size:8.5px;">';
    H += '<thead><tr style="background:#003366; color:#fff;">';
    H += '<th style="width:60%; padding:5px; text-align:left;">ITEM</th>';
    H += '<th style="width:15%; padding:5px; text-align:right;">ATUAL</th>';
    H += '<th style="width:15%; padding:5px; text-align:right;">ANTERIOR</th>';
    H += '<th style="width:10%; padding:5px; text-align:right;">VAR. (%)</th>';
    H += '</tr></thead><tbody>';

    const addSecao = (texto, bg) => {
        H += `<tr style="background:${bg}; color:#fff;"><td colspan="4" style="padding:4px 5px; text-align:left; font-size:8px; text-transform:uppercase;">${texto}</td></tr>`;
    };
    const addLinha = (item, at, an, variacao, classe) => {
        const bg = classe === 'zebra' ? '#f8f9fa' : (classe === 'total' ? '#e9ecef' : '#fff');
        const fw = classe === 'total' ? 'bold' : 'normal';
        H += `<tr style="background:${bg}; font-weight:${fw};">`;
        H += `<td style="padding:4px 5px; border:1px solid #ddd;">${item}</td>`;
        H += `<td style="padding:4px 5px; border:1px solid #ddd; text-align:right;">${at}</td>`;
        H += `<td style="padding:4px 5px; border:1px solid #ddd; text-align:right;">${an}</td>`;
        H += `<td style="padding:4px 5px; border:1px solid #ddd; text-align:right;">${variacao}</td>`;
        H += '</tr>';
    };

    const renderBloco = (titulo, obj) => {
        if (!obj) return;
        addSecao(titulo, '#003366');
        const keys = Object.keys(obj).filter(k => k !== 'detalhes');
        let count = 0;
        let sumAt = 0, sumAn = 0;

        keys.forEach(k => {
            const v = obj[k];
            if (v && typeof v === 'object' && 'atual' in v) {
                const at = v.atual || 0;
                const an = v.anterior || 0;
                sumAt += at; sumAn += an;
                addLinha(k.replace(/_/g,' ').toUpperCase(), moeda(at).replace('R$ ',''), moeda(an).replace('R$ ',''), varPct(at, an), count%2===0 ? 'zebra' : '');
                count++;
            }
        });
        addLinha('TOTAL', moeda(sumAt).replace('R$ ',''), moeda(sumAn).replace('R$ ',''), varPct(sumAt, sumAn), 'total');
    };

    renderBloco('Receitas', bf.receitas);
    renderBloco('Despesas', bf.despesas);
    renderBloco('Extraorçamentário', bf.extra);
    renderBloco('Caixa', bf.caixa);

    // --- TOTAIS GERAIS ---
    const getV = (obj, key, tipo) => (obj && obj[key] && obj[key][tipo]) ? Number(obj[key][tipo]) : 0;

    const recOrcAt = getV(bf.receitas, 'corrente', 'atual') + getV(bf.receitas, 'capital', 'atual');
    const recOrcAn = getV(bf.receitas, 'corrente', 'anterior') + getV(bf.receitas, 'capital', 'anterior');
    const recExtAt = getV(bf.extra, 'recebimentos', 'atual');
    const recExtAn = getV(bf.extra, 'recebimentos', 'anterior');
    const saldoAntAt = getV(bf.caixa, 'saldo_anterior', 'atual');
    const saldoAntAn = getV(bf.caixa, 'saldo_anterior', 'anterior');
    const totIngAt = recOrcAt + recExtAt + saldoAntAt;
    const totIngAn = recOrcAn + recExtAn + saldoAntAn;

    const despOrcAt = getV(bf.despesas, 'corrente', 'atual') + getV(bf.despesas, 'capital', 'atual');
    const despOrcAn = getV(bf.despesas, 'corrente', 'anterior') + getV(bf.despesas, 'capital', 'anterior');
    const despExtAt = getV(bf.extra, 'pagamentos', 'atual');
    const despExtAn = getV(bf.extra, 'pagamentos', 'anterior');
    const saldoSegAt = getV(bf.caixa, 'saldo_seguinte', 'atual');
    const saldoSegAn = getV(bf.caixa, 'saldo_seguinte', 'anterior');
    const totDispAt = despOrcAt + despExtAt + saldoSegAt;
    const totDispAn = despOrcAn + despExtAn + saldoSegAn;

    addSecao('TOTAL GERAL DE INGRESSOS', '#003366');
    addLinha('Receitas Orçamentárias (Corrente + Capital)', moeda(recOrcAt).replace('R$ ',''), moeda(recOrcAn).replace('R$ ',''), '-', 'zebra');
    addLinha('Recebimentos Extraorçamentários', moeda(recExtAt).replace('R$ ',''), moeda(recExtAn).replace('R$ ',''), '-', '');
    addLinha('Saldo em Espécie do Exercício Anterior', moeda(saldoAntAt).replace('R$ ',''), moeda(saldoAntAn).replace('R$ ',''), '-', 'zebra');

    H += '<tr style="background: #f8f9fa;"><td style="padding: 8px; border-bottom: 1px solid #eee; font-weight: bold;">(=) Margem Disponível (Limite - Custo)</td><td style="text-align: right; padding: 8px; border-bottom: 1px solid #eee; font-weight: bold;">' + valFmt(vMargem) + '</td><td style="text-align: right; padding: 8px; border-bottom: 1px solid #eee; font-weight: bold;">' + pct(pctMargem) + '</td></tr>';
    H += '<tr><td style="padding: 8px; border-bottom: 1px solid #eee;">Limite Resolução Cofen 814/2026 (' + limitePctStr + '% da RCL)</td><td style="text-align: right; padding: 8px; border-bottom: 1px solid #eee;">' + valFmt(vLimite) + '</td><td style="text-align: right; padding: 8px; border-bottom: 1px solid #eee;">' + pct(limitePctNum) + '</td></tr>';
    H += '<tr><td style="padding: 8px; border-bottom: 1px solid #eee;">Situação (' + entidadeAtual + ')</td><td style="text-align: right; padding: 8px; border-bottom: 1px solid #eee;"></td><td style="text-align: right; padding: 8px; border-bottom: 1px solid #eee; color: #28a745; font-weight: bold;">' + pct(pctCusto) + '</td></tr>';
    H += '</tbody>';
    H += '</table>';
} else { H += '<p>Módulo não encontrado.</p>'; }

// ===== 13. PARECER =====
H += tit(13, 'Parecer do Contador');
H += '<div class="desc">Conclusão da análise contábil.</div>';
H += '<div class="ok"><strong>Análise Concluída</strong><br>Os dados foram consolidados com sucesso.</div>';

document.getElementById('conteudo').innerHTML = H;
</script>
