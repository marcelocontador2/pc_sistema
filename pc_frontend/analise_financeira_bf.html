            const check = document.querySelector(".check-hist:checked");

                        // Extrai o período atual salvo (ex: 2026-TRIMESTRE-3)

                        const partes = periodoSalvo.split('-');
                        if (partes.length === 3) {
                            document.getElementById('ano').value = partes[0];
                            document.getElementById('tipo').value = partes[1];
                            document.getElementById('val').value = partes[2];
                        }
                        
                        // Chama a mesma função do botão "Verificar" para recalcular e desenhar
                        // Isso garante que os dados do período anterior sejam buscados novamente
                        carregar(); 
                    }
                })
                .catch(e => alert("Erro ao carregar o histórico: " + e.message));
        }

        


        


        function render(at, ant) {
            const tb = document.querySelector('#tab tbody');
            const fmtV = v => (v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            const fmtP = v => (v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
            const pct = (a, b) => b !== 0 ? ((a - b) / Math.abs(b)) * 100 : 0;
            const safe = (v) => (v && typeof v === 'object') ? v : {atual: 0, anterior: 0};
            const line = (label, va, vb, bold) => {
                const v = pct(va, vb);
                const cls = v >= 0 ? 'pos' : 'neg';
                const sg = v >= 0 ? '+' : '';
                const trStyle = bold ? 'font-weight:bold;' : '';
                return '<tr style="' + trStyle + '">' +
                    '<td>' + label + '</td>' +
                    '<td style="text-align:right;">' + fmtV(va) + '</td>' +
                    '<td style="text-align:right;">' + fmtV(vb) + '</td>' +
                    '<td class="' + cls + '" style="text-align:right;">' + sg + fmtP(v) + '</td>' +
                '</tr>';
            };
            const header = (label, color) => '<tr style="background:' + color + '; font-weight:bold; color:#fff;"><td colspan="4">' + label + '</td></tr>';
            const blank = () => '<tr><td colspan="4" style="height:5px; border:none;"></td></tr>';

            const R = {
                rec: {
                    corr: safe(at.receitas && at.receitas.corrente),
                    cap: safe(at.receitas && at.receitas.capital),
                    tot: safe(at.receitas && at.receitas.total),
                },
                desp: {
                    corr: safe(at.despesas && at.despesas.corrente),
                    cap: safe(at.despesas && at.despesas.capital),
                    tot: safe(at.despesas && at.despesas.total),
                },
                extra: {
                    rec: safe(at.extra && at.extra.recebimentos),
                    pag: safe(at.extra && at.extra.pagamentos),
                },
                caixa: {
                    ant: safe(at.caixa && at.caixa.saldo_anterior),
                    ger: safe(at.caixa && at.caixa.geracao_liquida),
                    seg: safe(at.caixa && at.caixa.saldo_seguinte),
                }
            };

            let out = '';
            out += header('RECEITAS', '#003366');
            out += line('Receitas Correntes', R.rec.corr.atual, R.rec.corr.anterior);
            out += line('Receitas de Capital', R.rec.cap.atual, R.rec.cap.anterior);
            out += line('Total de Receitas', R.rec.tot.atual, R.rec.tot.anterior, true);
            out += blank();
            out += header('DESPESAS', '#dc3545');
            out += line('Despesas Correntes', R.desp.corr.atual, R.desp.corr.anterior);
            out += line('Despesas de Capital', R.desp.cap.atual, R.desp.cap.anterior);
            out += line('Total de Despesas', R.desp.tot.atual, R.desp.tot.anterior, true);
            out += blank();
            out += header('EXTRAORCAMENTARIO', '#6c757d');
            out += line('Recebimentos Extraorcamentarios', R.extra.rec.atual, R.extra.rec.anterior);
            out += line('Pagamentos Extraorcamentarios', R.extra.pag.atual, R.extra.pag.anterior);
            out += blank();
            out += header('CAIXA E EQUIVALENTES', '#28a745');
            out += line('Saldo em Especie do Exerc. Anterior', R.caixa.ant.atual, R.caixa.ant.anterior);
            out += line('Geracao Liquida de Caixa', R.caixa.ger.atual, R.caixa.ger.anterior, true);
            out += line('Saldo em Especie para o Exerc. Seguinte', R.caixa.seg.atual, R.caixa.seg.anterior, true);

            tb.innerHTML = out;

            const ctx = document.getElementById('graf');
            if (!ctx) return;
            if (typeof chart !== 'undefined' && chart) chart.destroy();
            const chartCtx = ctx.getContext ? ctx.getContext('2d') : ctx;
            window.chart = new Chart(chartCtx, {

                data: {
                    labels: ['Receitas', 'Despesas', 'Saldo Ant.', 'Saldo Seg.'],
                    datasets: [
                        {

                            data: [R.rec.tot.atual, null, null, null],

                            borderColor: '#002244',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Despesas (Atual)',
                            data: [null, R.desp.tot.atual, null, null],
                            backgroundColor: '#dc3545',
                            borderColor: '#a71d2a',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Saldo Ant. (Atual)',
                            data: [null, null, R.caixa.ant.atual, null],
                            backgroundColor: '#4a90e2',
                            borderColor: '#2c6fbb',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Saldo Seg. (Atual)',

                            borderColor: '#1e7e34',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Receitas (Anterior)',
                            data: [R.rec.tot.anterior, null, null, null],
                            backgroundColor: '#4a90e2',
                            borderColor: '#357abd',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Despesas (Anterior)',
                            data: [null, R.desp.tot.anterior, null, null],
                            backgroundColor: '#e68a8a',
                            borderColor: '#c96b6b',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Saldo Ant. (Anterior)',
                            data: [null, null, R.caixa.ant.anterior, null],
                            backgroundColor: '#90c2e7',
                            borderColor: '#6ba8d4',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {

                            data: [null, null, null, R.caixa.seg.anterior],
                            backgroundColor: '#7ec87e',
                            borderColor: '#5fa85f',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        }
                    ]
                }ata: {
                    labels: ['Receitas', 'Despesas', 'Saldo Ant.', 'Saldo Seg.'],
                    datasets: [
                        // --- ATUAL ---
                        {
                            label: 'Receitas (Atual)',
                            data: [R.rec.tot.atual, null, null, null],
                            backgroundColor: '#003366',
                            borderColor: '#002244',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Despesas (Atual)',
                            data: [null, R.desp.tot.atual, null, null],
                            backgroundColor: '#dc3545',
                            borderColor: '#a71d2a',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Saldo Ant. (Atual)',
                            data: [null, null, R.caixa.ant.atual, null],

                            borderColor: '#2c6fbb',

                        },
                        {

                            backgroundColor: '#28a745',

                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        // --- ANTERIOR ---
                        {
                            label: 'Receitas (Anterior)',
                            data: [R.rec.tot.anterior, null, null, null],
                            backgroundColor: '#4a90e2',
                            borderColor: '#357abd',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Despesas (Anterior)',
                            data: [null, R.desp.tot.anterior, null, null],
                            backgroundColor: '#e68a8a',
                            borderColor: '#c96b6b',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Saldo Ant. (Anterior)',
                            data: [null, null, R.caixa.ant.anterior, null],
                            backgroundColor: '#90c2e7',
                            borderColor: '#6ba8d4',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        },
                        {
                            label: 'Saldo Seg. (Anterior)',
                            data: [null, null, null, R.caixa.seg.anterior],
                            backgroundColor: '#7ec87e',
                            borderColor: '#5fa85f',
                            borderWidth: 1, borderRadius: 6, barPercentage: 0.6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 12, weight: 'bold' },
                                padding: 15,
                                usePointStyle: true,
                                pointStyle: 'rectRounded'
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        label += 'R$ ' + context.parsed.y.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#eef2f7' },
                            ticks: {
                                callback: function(value) {
                                    return 'R$ ' + (value / 1000000).toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' mi';
                                },
                                font: { size: 11 }
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 12, weight: 'bold' } }
                        }
                    }
                }
            });                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#eef2f7' },
                            ticks: {
                                callback: function(value) {
                                    return 'R$ ' + (value / 1000000).toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' mi';

                            }

                }
            });        }

</script>
<style>

<body>
<div class="topbar">
<a href="/" class="btn" style="background:#ff7f00">&#8592; Voltar</a>
<button class="btn" style="background:#28a745" onclick="exibirSelecionado()">Exibir</button>
<button class="btn" style="background:#dc3545" onclick="excluirSelecionado()">Excluir</button>
<button class="btn" style="background:#0056b3" onclick="gerarPDF()">Gerar PDF</button>
</div>
<div class="hdr-sub">Análise Financeira</div>
<div class="hdr-tit">Balanço Financeiro Comparativo</div>
<div class="filtros">
<label>Ano:</label>
<select id="ano"><option>2026</option><option>2025</option></select>
<label>Tipo:</label>
<select id="tipo"><option value="TRIMESTRE">Trimestre</option><option value="MES">Mês</option><option value="EXERCICIO">Exercício</option></select>
<select id="val"><option value="3">3º Trimestre</option><option value="1">1º Trimestre</option><option value="2">2º Trimestre</option><option value="4">4º Trimestre</option></select>
<button class="btn" style="background:#0056b3" onclick="carregar()">Verificar</button>
<button class="btn" id="btn-confirmar" onclick="salvar()">Confirmar e Salvar</button>
</div>
<div class="layout">
<div class="side"><h3>Histórico Salvo</h3><ul id="historico-lista"><li>Carregando...</li></ul></div>
<div class="main">
<div class="esq">
<div class="tab"><table id="tab">
<thead><tr><th>Indicador</th><th>Período Atual</th><th>Período Anterior</th><th>Var. (%)</th></tr></thead>
<tbody><tr><td colspan="4" style="text-align:center">Clique em Verificar</td></tr></tbody>
</table></div>
<div class="concl" id="concl" style="display:none"></div>
</div>
<div class="dir"><canvas id="graf" style="min-height:320px"></canvas></div>
</div>
</div>
<script>
let chart=null;
function mp(a,t,v){ if(t==='EXERCICIO') return a; return a+'-'+t+'-'+v; }
function fmt(v){ return (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pct(va,vb){ if(!vb||vb===0) return '-'; return (((va-vb)/Math.abs(vb))*100).toFixed(2).replace('.',',')+'%'; }

function carregar(){
  
const ano = document.getElementById('ano').value;
  const tipo = document.getElementById('tipo').value;
  const val = document.getElementById('val').value;
  const pA = mp(ano,tipo,val);
  const pB = mp(String(parseInt(ano)-1),tipo,val);
  fetch('/api/analise_financeira_bf/'+pA)
    .then(r=>r.json())
    .then(a=>{
        // === CARD: demonstrativos faltando ===
        const conclEl = document.getElementById("concl");
        if (conclEl) { conclEl.style.display = "none"; conclEl.innerHTML = ""; }
        if (a && a.erro === "faltando") {
            const divErro = document.getElementById("concl") || document.querySelector(".concl") || document.body;
            divErro.style.display = "block";
            let htmlErro = '<div style="background:#fff3cd;border-left:5px solid #ffc107;padding:20px;border-radius:8px;">';
            htmlErro += '<h3 style="color:#856404;margin:0 0 10px 0;">⚠️ Demonstrativos Faltando</h3>';
            htmlErro += '<p style="color:#856404;">Os seguintes demonstrativos não foram importados:</p><ul style="color:#856404;">';
            [...new Set(a.pecas || [])].forEach(p => { htmlErro += '<li>' + p + '</li>'; });
            htmlErro += '</ul><p style="color:#856404;margin-top:10px;">Acesse <strong>Importar Relatórios</strong> para enviar os arquivos pendentes.</p></div>';
            divErro.innerHTML = htmlErro;
            const tbErro = document.querySelector("#tab tbody");
            if (tbErro) tbErro.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#856404;">Aguardando importação.</td></tr>';
            if (typeof chart !== 'undefined' && chart) { chart.destroy(); chart = null; }
            return;
        }

      if(a.erro){alert(a.mensagem);return;}
      // Os dois periodos ja vem no mesmo JSON: a.dados
      document.getElementById('btn-confirmar').style.display = 'inline-block';
      document.getElementById('btn-confirmar').setAttribute('data-periodo-atual', pA);
      document.getElementById('btn-confirmar').setAttribute('data-periodo-anterior', pB);
      render(a.dados, a.dados);
    }).catch(e=>alert('Erro: '+e.message));
}



function salvar(){
  const btn = document.getElementById('btn-confirmar');
  const pA = btn.getAttribute('data-periodo-atual');
  const pB = btn.getAttribute('data-periodo-anterior');
  if(!pA){alert('Verifique primeiro.');return;}
  // Busca a API novamente para garantir que temos os dados atual + anterior corretos
  fetch('/api/analise_financeira_bf/'+pA).then(r=>r.json()).then(a=>{
    if(a.erro){alert(a.mensagem);return;}
    // Envia para o backend: {atual: a.dados, anterior: a.dados} (mesmo CSV, duas colunas)
    const payload = {atual: a.dados, anterior: a.dados};
    // O backend espera /salvar_analise_financeira_bf/{periodo_atual}/{periodo_anterior} via POST
    // Mas o formato de JSON nao e o que o backend usa. Vamos usar o formato simplificado:
    // Envia o JSON completo com atual e anterior (que sao o mesmo objeto, ja que o CSV tem as duas colunas)
    fetch('/salvar_analise_financeira_bf/'+pA+'/'+pB, {method: 'POST'})
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(()=>{alert('Relatorio salvo!');carregarHistorico();})
      .catch(e=>alert('Erro: '+e.message));
  });
}

function carregarHistorico(){
  const el = document.getElementById('historico-lista');
  fetch('/historico_analise_financeira_bf').then(r=>r.json()).then(d=>{
    if(!d||d.length===0){el.innerHTML='<li>Nenhum histórico.</li>';return;}
    let html = '';
    d.forEach(i=>{html += '<li><label><input type="checkbox" class="check-hist" value="'+i.id+'"> <strong>'+i.periodo+'</strong><br><small>'+i.data_geracao+'</small></label></li>';});
    el.innerHTML = html;
  }).catch(()=>{el.innerHTML='<li>Erro.</li>';});
}

function excluirSelecionado(){
  const sel = document.querySelectorAll('.check-hist:checked');
  if(sel.length===0){alert('Selecione um item.');return;}
  if(!confirm('Excluir '+sel.length+'?'))return;
  Promise.all([...sel].map(c=>fetch('/excluir_analise_financeira_bf/'+c.value,{method:'DELETE'}).then(r=>r.ok).catch(()=>false)))
    .then(rs=>{if(rs.some(x=>x)){alert('Excluído!');carregarHistorico();}});
}
function gerarPDF(){
  const ck = document.querySelector('.check-hist:checked');
  if(!ck){alert('Marque um item.');return;}
  window.open('/gerar_pdf_analise_financeira_bf/'+ck.value,'_blank');
}
document.addEventListener('DOMContentLoaded', carregarHistorico);
function exibirSelecionado() {
            const check = document.querySelector(".check-hist:checked");
            if (!check) { alert("Selecione um item no histórico."); return; }

            fetch('/historico_analise_financeira_bf/' + check.value)
                .then(r => r.json())
                .then(resp => {
                    if (resp.periodo_atual) {
                        // Extrai o período atual salvo (ex: 2026-TRIMESTRE-3)
                        const periodoSalvo = resp.periodo_atual;
                        
                        // Reconstrói os selects (ano, tipo, val) com base no período
                        const partes = periodoSalvo.split('-');
                        if (partes.length === 3) {
                            document.getElementById('ano').value = partes[0];
                            document.getElementById('tipo').value = partes[1];
                            document.getElementById('val').value = partes[2];
                        }
                        
                        // Chama a mesma função do botão "Verificar" para recalcular e desenhar
                        // Isso garante que os dados do período anterior sejam buscados novamente
                        carregar(); 
                    }
                })
                .catch(e => alert("Erro ao carregar o histórico: " + e.message));
        }

        function render(at, ant) {
            const tb = document.querySelector('#tab tbody');
            const fmtV = v => (v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            const fmtP = v => (v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
            const pct = (a, b) => b !== 0 ? ((a - b) / Math.abs(b)) * 100 : 0;
            const safe = (v) => (v && typeof v === 'object') ? v : {atual: 0, anterior: 0};
            const line = (label, va, vb, bold) => {
                const v = pct(va, vb);
                const cls = v >= 0 ? 'pos' : 'neg';
                const sg = v >= 0 ? '+' : '';
                const trStyle = bold ? 'font-weight:bold;' : '';
                return '<tr style="' + trStyle + '">' +
                    '<td>' + label + '</td>' +
                    '<td style="text-align:right;">' + fmtV(va) + '</td>' +
                    '<td style="text-align:right;">' + fmtV(vb) + '</td>' +
                    '<td class="' + cls + '" style="text-align:right;">' + sg + fmtP(v) + '</td>' +
                '</tr>';
            };
            const header = (label, color) => '<tr style="background:' + color + '; font-weight:bold; color:#fff;"><td colspan="4">' + label + '</td></tr>';
            const blank = () => '<tr><td colspan="4" style="height:5px; border:none;"></td></tr>';

            const R = {
                rec: {
                    corr: safe(at.receitas && at.receitas.corrente),
                    cap: safe(at.receitas && at.receitas.capital),
                    tot: safe(at.receitas && at.receitas.total),
                },
                desp: {
                    corr: safe(at.despesas && at.despesas.corrente),
